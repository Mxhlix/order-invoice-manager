<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#1b2430; --muted:#5d6b7a; --line:#dfe4ea; --bg:#f3f5f8; --card:#fff;
    --pri:#1f5fbf; --pri-d:#174a96; --acc:#e5880c; --acc-d:#b26708; --ok:#2e8b57; --warn:#c0392b; --warn-bg:#fdecea;
    --nav:#1b2430;
  }
  html,body{height:100%}
  body{font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
  #app{display:flex;min-height:100vh}

  .nav{width:196px;background:var(--nav);color:#e9edf2;display:flex;flex-direction:column;flex:0 0 196px}
  .brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
  .brand-name{font-weight:800;font-size:14.5px;line-height:1.35}
  .brand-sub{font-size:11.5px;color:#a9b4c2;margin-top:4px}
  .nav nav{padding:10px 8px;flex:1}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#c8d1dc;font:inherit;font-size:14px;font-weight:600;padding:10px 12px;border-radius:8px;cursor:pointer}
  .nav-item .ic{width:18px;text-align:center;opacity:.8;font-size:13px}
  .nav-item:hover{background:rgba(255,255,255,.07)}
  .nav-item.active{background:var(--pri);color:#fff}
  .user{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px}
  .user-name{font-weight:700}
  .user-role{color:#a9b4c2;margin-top:2px}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
  .topbar h1{font-size:18px;font-weight:800}
  .topbar-right{display:flex;align-items:center;gap:14px}
  .today{color:var(--muted);font-size:13px}

  .view{padding:16px 22px 26px;display:flex;flex-direction:column;gap:14px}
  .hidden{display:none !important}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .card-head h2{font-size:15px;font-weight:800}
  .hint{color:var(--muted);font-size:12.5px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kpi .k{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:4px}
  .kpi.warn .v{color:var(--acc-d)}

  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
  .tbl th{font-size:12px;color:var(--muted);font-weight:700;background:#f8f9fb}
  .tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
  .tbl tbody tr:hover{background:#f7f9fc}
  .tbl td.wrap{white-space:normal}
  .tbl .mono{font-family:inherit;font-variant-numeric:tabular-nums;font-weight:600}
  .tbl .empty td{color:var(--muted);text-align:center;padding:18px}

  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef1f5;color:#3b4652}
  .badge.b-quote{background:#eaf1fb;color:var(--pri-d)}
  .badge.b-order{background:#e8f4ee;color:#1f6b40}
  .badge.b-sales{background:#fdf1e0;color:var(--acc-d)}
  .badge.b-inv{background:#e6e9f7;color:#3b3f8c}
  .badge.b-lost{background:#f0f0f0;color:#777}
  .badge.b-warn{background:var(--warn-bg);color:var(--warn)}

  .steps{display:inline-flex;align-items:center;gap:4px}
  .steps i{display:inline-block;width:38px;height:8px;border-radius:4px;background:#e3e7ec}
  .steps i.on{background:var(--pri)}
  .steps i.done{background:var(--ok)}

  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;margin-bottom:12px}
  label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:#3b4652}
  .cap{display:flex;align-items:center;gap:6px}
  .req{display:inline-block;font-size:10.5px;color:#fff;background:var(--warn);padding:0 6px;border-radius:4px;font-weight:700;vertical-align:middle}
  input[type=text],input[type=number],input[type=date],select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #c9d1db;border-radius:7px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus{outline:2px solid rgba(31,95,191,.35);border-color:var(--pri)}
  input.bad,select.bad{border-color:var(--warn);background:#fff8f7}
  .inline{display:flex;gap:10px;align-items:center}
  .inline input[type=number]{flex:1}
  .chk{flex-direction:row;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
  .chk input{width:auto}

  .tbl.lines input,.tbl.lines select{padding:6px 8px;font-size:13.5px}
  .tbl.lines td{padding:5px 6px}
  .tbl.lines td.amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .tbl.lines .del{background:none;border:none;color:#999;cursor:pointer;font-size:16px}
  .lines-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px}
  .totals{display:flex;flex-direction:column;gap:3px;min-width:260px}
  .totals div{display:flex;justify-content:space-between;font-size:13.5px;color:#3b4652}
  .totals b{font-variant-numeric:tabular-nums}
  .totals .grand{border-top:1.5px solid var(--ink);padding-top:5px;margin-top:3px;font-size:16px;color:var(--ink)}
  .totals .grand b{font-size:19px}

  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
  .btn{font:inherit;font-size:14px;font-weight:700;padding:9px 16px;border-radius:8px;border:1px solid #c9d1db;background:#fff;color:var(--ink);cursor:pointer}
  .btn:hover{background:#f3f5f8}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn.primary:hover{background:var(--pri-d)}
  .btn.accent{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.accent:hover{background:var(--acc-d)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--pri)}
  .btn.sm{padding:5px 10px;font-size:12.5px}

  .alert{background:var(--warn-bg);color:var(--warn);border:1px solid #f3c4bf;border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600;white-space:pre-line;margin-top:10px}
  .alert.ok{background:#e8f4ee;color:#1f6b40;border-color:#bfe0cc}
  .alert.info{background:#eaf1fb;color:var(--pri-d);border-color:#c5d7f2}

  .closing-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .closing-bar label{flex-direction:row;align-items:center;gap:8px}
  .closing-bar input{width:170px}
  .closing-msg{font-weight:700;color:var(--muted)}
  .skipped{margin-top:10px;font-size:13px;color:var(--muted)}
  .skipped b{color:var(--acc-d)}
  .issued{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .issued .row{display:flex;align-items:center;gap:12px;background:#e8f4ee;border:1px solid #bfe0cc;border-radius:8px;padding:8px 12px;font-weight:600}
  .issued .row .no{font-weight:800;color:#1f6b40}
  .issued .row .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800}

  .modal{position:fixed;inset:0;background:rgba(20,28,40,.45);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-box{background:#fff;border-radius:12px;padding:18px 20px;min-width:420px;max-width:92vw;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal-box h3{font-size:16px;font-weight:800;margin-bottom:8px}
  .modal-box p{white-space:pre-line;color:#3b4652;margin-bottom:12px}
  .modal-box .actions{margin-top:8px}
  .doc-frame{width:760px;height:560px;border:1px solid var(--line);border-radius:6px;background:#eee}
  .doc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .doc-head .name{font-weight:800}
  .doc-head .path{font-size:12px;color:var(--muted)}

  .toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:60}
  .toast.ok{background:var(--ok)}
  .toast.warn{background:var(--warn)}
</style>
